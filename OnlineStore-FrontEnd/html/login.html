<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Cartiva</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

<div class="auth-wrap">

    <a class="brand auth-brand" href="index.html">
        <span class="brand-mark">C</span>
        Cartiva
    </a>

    <div class="auth-card">

        <span class="eyebrow">WELCOME BACK</span>

        <h1>Sign in</h1>

        <p class="muted-text">
            Access your account and orders.
        </p>

        <form id="login-form">

            <label for="email">
                Email

                <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Enter your email"
                        required
                >
            </label>

            <label for="password">
                Password

                <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        required
                >
            </label>

            <button type="submit" class="btn btn-primary btn-block">
                Sign in
            </button>

        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>

    </div>

</div>

</body>
</html>
